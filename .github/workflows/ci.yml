name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm build

  perf:
    name: Performance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PERF_ROUNDS: 5
      BASELINE_DIR: ${{ runner.temp }}/perf-baseline
      # Skip husky's `prepare` script: linked worktrees share `.git/hooks` with
      # the main checkout, so installing in the baseline tree would otherwise
      # rewrite the main repo's hooks.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect non-doc changes
        id: changes
        run: |
          if git diff --name-only \
              ${{ github.event.pull_request.base.sha }} \
              ${{ github.sha }} \
            | grep -Ev '^(\.changeset/|.+\.md$|LICENSE$|\.gitignore$)' \
            | grep -q .; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping perf job: only docs/changeset files changed."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.should_run == 'true'

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.should_run == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Set up baseline worktree
        if: steps.changes.outputs.should_run == 'true'
        run: |
          git worktree add --detach "$BASELINE_DIR" \
            ${{ github.event.pull_request.base.sha }}

      - name: Install dependencies (current)
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm install

      - name: Install dependencies (baseline)
        if: steps.changes.outputs.should_run == 'true'
        working-directory: ${{ env.BASELINE_DIR }}
        run: pnpm install

      - name: Run interleaved benchmarks
        if: steps.changes.outputs.should_run == 'true'
        run: |
          mkdir -p .perf-results
          for i in $(seq 1 "$PERF_ROUNDS"); do
            echo "::group::Round $i — baseline"
            (cd "$BASELINE_DIR" && pnpm exec vitest bench \
              --outputJson "$GITHUB_WORKSPACE/.perf-results/baseline-$i.json" \
              --passWithNoTests)
            echo "::endgroup::"
            echo "::group::Round $i — current"
            pnpm exec vitest bench \
              --outputJson ".perf-results/current-$i.json" \
              --passWithNoTests
            echo "::endgroup::"
          done

      - name: Compare results
        if: always() && steps.changes.outputs.should_run == 'true'
        run: pnpm perf-compare

      - name: Upload performance results
        if: always() && steps.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: .perf-results
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Post or update PR comment
        if: always() && steps.changes.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- perf-results -->";
            let body;
            try {
              body = fs.readFileSync(".perf-results/comparison.md", "utf-8");
            } catch {
              body = "No performance results available.";
            }
            body = `${marker}\n${body}`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              },
            );
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
