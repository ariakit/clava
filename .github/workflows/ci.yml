name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm build

  perf:
    name: Performance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Clean runs stop after two paired rounds. Significant deltas get one
      # extra confirmation round, which makes the final comparison require
      # three-round unanimity before reporting the change.
      PERF_INITIAL_ROUNDS: 2
      PERF_CONFIRMATION_ROUNDS: 1
      # Skip husky's `prepare` script: linked worktrees share `.git/hooks` with
      # the main checkout, so installing in the baseline tree would otherwise
      # rewrite the main repo's hooks.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # `runner.temp` is not available in job-level `env`, so set BASELINE_DIR
      # here using the auto-injected $RUNNER_TEMP and export it for later steps.
      - name: Set up baseline worktree
        run: |
          BASELINE_DIR="$RUNNER_TEMP/perf-baseline"
          echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"
          git worktree add --detach "$BASELINE_DIR" \
            ${{ github.event.pull_request.base.sha }}

      - name: Install dependencies (current)
        run: pnpm install

      - name: Install dependencies (baseline)
        working-directory: ${{ env.BASELINE_DIR }}
        run: pnpm install

      - name: Build packages (current)
        run: pnpm build

      - name: Build packages (baseline)
        working-directory: ${{ env.BASELINE_DIR }}
        run: pnpm build

      - name: Run interleaved benchmarks
        run: |
          mkdir -p .perf-results

          run_vitest_bench() {
            local output="$1"
            local config_args=()

            if [ -f vitest.bench.config.ts ]; then
              config_args=(--config vitest.bench.config.ts)
            fi

            pnpm exec vitest bench \
              "${config_args[@]}" \
              --outputJson "$output" \
              --passWithNoTests
          }

          run_perf_round() {
            local i="$1"

            echo "::group::Round $i - baseline"
            (cd "$BASELINE_DIR" && \
              run_vitest_bench "$GITHUB_WORKSPACE/.perf-results/baseline-$i.json")
            echo "::endgroup::"
            echo "::group::Round $i - current"
            run_vitest_bench ".perf-results/current-$i.json"
            echo "::endgroup::"
          }

          for i in $(seq 1 "$PERF_INITIAL_ROUNDS"); do
            run_perf_round "$i"
          done

          echo "::group::Preliminary comparison"
          pnpm perf-compare
          needs_confirmation=$(
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const summary = JSON.parse(
            readFileSync(".perf-results/comparison.json", "utf-8"),
          );

          const needsConfirmation =
            summary.hasSignificantChanges || summary.hasConfirmableChanges;

          console.log(needsConfirmation ? "true" : "false");
          NODE
          )
          echo "::endgroup::"

          if [ "$needs_confirmation" = "true" ]; then
            echo "Potential performance changes detected; running confirmation rounds."
            start_round=$((PERF_INITIAL_ROUNDS + 1))
            end_round=$((PERF_INITIAL_ROUNDS + PERF_CONFIRMATION_ROUNDS))
            for i in $(seq "$start_round" "$end_round"); do
              run_perf_round "$i"
            done
          else
            echo "No significant changes detected; skipping confirmation rounds."
          fi

      - name: Compare results
        if: always()
        run: pnpm perf-compare

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: .perf-results
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Post or update PR comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- perf-results -->";
            let body;
            try {
              body = fs.readFileSync(".perf-results/comparison.md", "utf-8");
            } catch {
              body = "No performance results available.";
            }
            body = `${marker}\n${body}`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              },
            );
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
