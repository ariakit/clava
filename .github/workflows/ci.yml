name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm tsc

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm build

  perf:
    name: Performance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Clean runs stop after two paired rounds. Significant deltas get three
      # extra confirmation rounds, which lets the final comparison tolerate a
      # single noisy run while still requiring material agreement.
      PERF_INITIAL_ROUNDS: 2
      PERF_CONFIRMATION_ROUNDS: 3
      # Skip Git hook installation in both worktrees.
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      # `runner.temp` is not available in job-level `env`, so set BASELINE_DIR
      # here using the auto-injected $RUNNER_TEMP and export it for later steps.
      - name: Set up baseline worktree
        run: |
          BASELINE_DIR="$RUNNER_TEMP/perf-baseline"
          echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"
          git worktree add --detach "$BASELINE_DIR" \
            ${{ github.event.pull_request.base.sha }}

      - name: Install dependencies (current)
        run: pnpm install

      - name: Install dependencies (baseline)
        working-directory: ${{ env.BASELINE_DIR }}
        run: pnpm install

      - name: Build packages (current)
        run: pnpm build

      - name: Build packages (baseline)
        working-directory: ${{ env.BASELINE_DIR }}
        run: pnpm build

      - name: Measure bundle size
        run: |
          mkdir -p .perf-results

          measure_bundle_size() {
            local label="$1"
            local source_root="$2"
            local output="$3"

            echo "::group::Bundle size - $label"
            if ! pnpm bundle-size \
              --source-root "$source_root" \
              --output "$output"; then
              echo "::warning::Failed to measure $label bundle size."
            fi
            echo "::endgroup::"
          }

          measure_bundle_size baseline \
            "$BASELINE_DIR" \
            .perf-results/bundle-size-baseline.json
          measure_bundle_size current \
            "$GITHUB_WORKSPACE" \
            .perf-results/bundle-size-current.json

      - name: Run interleaved benchmarks
        run: |
          mkdir -p .perf-results

          # The baseline can still use Vitest 4 until this migration merges.
          baseline_major=$(cd "$BASELINE_DIR" && node -p \
            'require("./package.json").devDependencies.vitest.split(".")[0]')
          baseline_reporter=(--reporter=default --reporter=json --outputFile)
          if [ "$baseline_major" -lt 5 ]; then
            baseline_reporter=(--outputJson)
          fi

          run_perf_round() {
            local i="$1"

            echo "::group::Round $i - baseline"
            (cd "$BASELINE_DIR" && pnpm bench \
              "${baseline_reporter[@]}" "$GITHUB_WORKSPACE/.perf-results/baseline-$i.json" \
              --passWithNoTests)
            echo "::endgroup::"
            echo "::group::Round $i - current"
            pnpm bench \
              --reporter=default --reporter=json \
              --outputFile ".perf-results/current-$i.json" \
              --passWithNoTests
            echo "::endgroup::"
          }

          for i in $(seq 1 "$PERF_INITIAL_ROUNDS"); do
            run_perf_round "$i"
          done

          echo "::group::Preliminary comparison"
          pnpm perf-compare
          needs_confirmation=$(
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const summary = JSON.parse(
            readFileSync(".perf-results/comparison.json", "utf-8"),
          );

          const needsConfirmation =
            summary.hasSignificantChanges || summary.hasConfirmableChanges;

          console.log(needsConfirmation ? "true" : "false");
          NODE
          )
          echo "::endgroup::"

          if [ "$needs_confirmation" = "true" ]; then
            echo "Potential performance changes detected; running confirmation rounds."
            start_round=$((PERF_INITIAL_ROUNDS + 1))
            end_round=$((PERF_INITIAL_ROUNDS + PERF_CONFIRMATION_ROUNDS))
            for i in $(seq "$start_round" "$end_round"); do
              run_perf_round "$i"
            done
          else
            echo "No significant changes detected; skipping confirmation rounds."
          fi

      - name: Compare results
        if: always()
        run: pnpm perf-compare

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: .perf-results
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Create GitHub App token
        id: app-token
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ARIAKIT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARIAKIT_CI_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Post or update PR comment
        if: >
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.app-token.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require("fs");
            const marker = "<!-- perf-results -->";
            let body;
            try {
              body = fs.readFileSync(".perf-results/comparison.md", "utf-8");
            } catch {
              body = "No performance results available.";
            }
            body = `${marker}\n${body}`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              },
            );
            const matches = comments.filter(
              (comment) =>
                comment.body?.includes(marker) &&
                comment.user?.login === "ariakito[bot]",
            );
            const existing = matches.at(-1);

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
